version: '3.8'

services:
  upsc-app:
    build: .
    ports:
      - "5000:5000"
    depends_on:
      - mssql-db
    environment:
      - DB_USER=sa
      - DB_PASSWORD=UpscAppPassword123!
      - DB_SERVER=mssql-db
      - DB_NAME=upsc_db
      - JWT_SECRET=super_secret_jwt_key_123
      - PORT=5000
    restart: unless-stopped

  mssql-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=UpscAppPassword123!
    volumes:
      - mssql-data:/var/opt/mssql
    restart: unless-stopped

volumes:
  mssql-data:
