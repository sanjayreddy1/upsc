version: '3.8'

services:
  upsc-app:
    build: .
    ports:
      - "5000:5000"
    depends_on:
      - postgres-db
    environment:
      - DATABASE_URL=postgres://upsc_user:UpscAppPassword123!@postgres-db:5432/upsc_db
      - JWT_SECRET=super_secret_jwt_key_123
      - PORT=5000
    restart: unless-stopped

  postgres-db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=upsc_user
      - POSTGRES_PASSWORD=UpscAppPassword123!
      - POSTGRES_DB=upsc_db
    volumes:
      - pg-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pg-data:
